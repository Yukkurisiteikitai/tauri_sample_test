[package]
name = "tauri_sample"
version = "0.1.0"
edition = "2021"
rust-version = "1.60"
authors = ["Tauri Dev Team"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.54.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
] }
